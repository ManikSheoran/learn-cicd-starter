name: cd

on:
  push:
    branches: [main, autobuild]

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Building app
        run: ./scripts/buildprod.sh

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/358965986501/locations/global/workloadIdentityPools/github/providers/my-repo
          service_account: cloud-run-deployer@project-c9ee6c56-17be-4378-9d0.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: project-c9ee6c56-17be-4378-9d0

      - name: Build and push Docker image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/project-c9ee6c56-17be-4378-9d0/notely-ar-repo/notely:latest .
